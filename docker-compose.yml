services:

  api1:
    build: ./Api
    container_name: api_3000
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - red-lab


  api2:
    build: ./Api
    container_name: api_3001
    ports:
      - "3001:3000"
    env_file:
      - .env
    networks:
      - red-lab


  api3:
    build: ./Api
    container_name: api_3002
    ports:
      - "3002:3000"
    env_file:
      - .env
    networks:
      - red-lab


  postgres:
    image: postgres:16
    container_name: postgres_lab02
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - red-lab


volumes:
  postgres_data:


networks:
  red-lab: